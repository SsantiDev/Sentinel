services:
  redis:
    image: redis:7-alpine
    restart: always
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  web:
    build: ./backend
    command: gunicorn config.wsgi:application --bind 0.0.0.0:8000 --workers 2
    env_file: ./backend/.env.production
    environment:
      - DJANGO_SETTINGS_MODULE=config.settings.production
    restart: always
    depends_on:
      redis:
        condition: service_healthy

  worker:
    build: ./backend
    command: celery -A config worker -l info -c 2
    env_file: ./backend/.env.production
    environment:
      - DJANGO_SETTINGS_MODULE=config.settings.production
    restart: always
    depends_on:
      - web
      - redis

  beat:
    build: ./backend
    command: celery -A config beat -l info
    env_file: ./backend/.env.production
    environment:
      - DJANGO_SETTINGS_MODULE=config.settings.production
    restart: always
    depends_on:
      - worker

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    volumes:
      - frontend_dist:/dist

  nginx:
    image: nginx:alpine
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - frontend_dist:/usr/share/nginx/html:ro
      - /etc/letsencrypt:/etc/letsencrypt:ro
    depends_on:
      - web
      - frontend

volumes:
  frontend_dist:
