upstream sentinel_api {
    server web:8000;
}

server {
    listen 80;
    server_name sentinel.ssantiago.dev;

    # Tope explicito del tamano del cuerpo de una peticion. Protege la memoria:
    # un payload mas grande se rechaza aqui (413) antes de cargarse en el backend.
    # 1 MB sobra para el lote maximo de 1000 transacciones.
    client_max_body_size 1m;

    # Frontend React SPA
    location / {
        root /usr/share/nginx/html;
        try_files $uri $uri/ /index.html;
    }

    # Backend API
    location /api/ {
        proxy_pass http://sentinel_api;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        proxy_connect_timeout 60s;
        proxy_read_timeout 60s;
    }

    # Django admin
    location /admin/ {
        proxy_pass http://sentinel_api;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
    }

    # Django static files (admin CSS, etc.)
    location /static/ {
        proxy_pass http://sentinel_api;
    }
}
