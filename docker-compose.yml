services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: sentinel_db
      POSTGRES_USER: sentinel
      POSTGRES_PASSWORD: password
    ports:
      # Solo local (127.0.0.1) para ver la base con un cliente como DBeaver.
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sentinel"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  web:
    build: ./backend
    # Al arrancar: aplica migraciones y crea el superusuario (si no existe),
    # luego levanta el servidor. Asi solo hace falta "docker compose up".
    command: >
      sh -c "python manage.py migrate --noinput &&
             (python manage.py createsuperuser --noinput || true) &&
             gunicorn config.wsgi:application --bind 0.0.0.0:8000 --reload"
    volumes:
      - ./backend:/app
    ports:
      - "8000:8000"
    env_file: ./backend/.env
    environment:
      - DJANGO_SETTINGS_MODULE=config.settings.local
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  worker:
    build: ./backend
    command: celery -A config worker -l info -c 4
    volumes:
      - ./backend:/app
    env_file: ./backend/.env
    environment:
      - DJANGO_SETTINGS_MODULE=config.settings.local
    depends_on:
      - web
      - redis

  beat:
    build: ./backend
    command: celery -A config beat -l info
    volumes:
      - ./backend:/app
    env_file: ./backend/.env
    environment:
      - DJANGO_SETTINGS_MODULE=config.settings.local
    depends_on:
      - worker

  nginx:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    ports:
      - "80:80"
    depends_on:
      - web

volumes:
  postgres_data:
